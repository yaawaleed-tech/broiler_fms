<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="broiler_fms">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>broiler_fms</title>
  <link rel="manifest" href="manifest.json">

  <!-- Shown while the Flutter bundle downloads; removed on first frame. -->
  <style>
    #app-loading{
      position:fixed; inset:0; z-index:9999;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:16px; background:#EFE9D8; color:#5A4E3E;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      font-size:.95rem;
    }
    #app-loading .spinner{
      width:40px; height:40px; border-radius:50%;
      border:4px solid #DED3BE; border-top-color:#A8442A;
      animation:app-loading-spin .8s linear infinite;
    }
    #app-loading p{margin:0}
    @keyframes app-loading-spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion:reduce){
      #app-loading .spinner{animation:none; border-top-color:#DED3BE}
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <p>Loading...</p>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
